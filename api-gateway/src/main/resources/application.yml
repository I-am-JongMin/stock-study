spring:
  application:
    name: stockstudy

  # ADR-003 — WebFlux 대신 Spring MVC + 가상 스레드.
  # 리액티브 연산자를 배우는 것이 목표가 아니라 락·트랜잭션을 이해하는 것이 목표이므로,
  # 코드를 블로킹 스타일로 유지하면서 확장성만 가상 스레드로 얻는다.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockstudy}
    username: ${DB_USERNAME:stockstudy}
    password: ${DB_PASSWORD:stockstudy}
    hikari:
      pool-name: stockstudy-pool
      maximum-pool-size: 20
      minimum-idle: 5
      # R5 — DB 가 응답하지 않으면 빠르게 실패한다.
      # 커넥션을 기다리며 스레드가 쌓이면 장애가 전체로 번진다.
      connection-timeout: 3000
      validation-timeout: 1000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 운영 스키마를 코드로만 바꾼다. 손으로 DDL 을 치면 환경 간 스키마가 갈라진다.
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false   # ISO-8601 로 직렬화 (§F2 asOf)

  lifecycle:
    timeout-per-shutdown-phase: 20s

# ── 키움 REST API (ADR-021) ──
# 기본값은 모의투자다. 실전 전환은 KIWOOM_BASE_URL 교체로만 한다 (하네스 G4).
# 키는 .env 에 두고 여기서는 환경변수로만 참조한다 (ADR-019/022).
kiwoom:
  base-url: ${KIWOOM_BASE_URL:https://mockapi.kiwoom.com}
  app-key: ${KIWOOM_APP_KEY:}
  app-secret: ${KIWOOM_APP_SECRET:}
  account-no: ${KIWOOM_ACCOUNT_NO:}
  # R5 — 외부가 느려도 우리 스레드가 매달려 있지 않는다.
  # 이 둘의 합은 반드시 token.lock-ttl 보다 작아야 한다 (ADR-024). 기동 시 검증된다.
  connect-timeout: 2s
  read-timeout: 5s
  token:
    cache-key: kiwoom:token
    lock-key: kiwoom:token:lock
    lock-ttl: 10s
    wait-timeout: 10s
    retry-interval: 50ms
    # 남은 유효시간이 10% 아래면 선제 갱신한다 — 만료 순간의 동시 요청을 만들지 않는다 (§R3)
    refresh-margin: 0.1
  # TR 1 개당 초당 1 회 수준의 모의투자 한도 (ADR-025).
  # 1 초가 아니라 1.1 초인 이유는 경계 판정이 서버 시계라서다 — 여유 10%.
  rate-limit:
    key-prefix: "kiwoom:rl:"
    interval: 1100ms
    max-wait: 30s

# ── 종목마스터 동기화 안전장치 (ADR-026) ──
# 외부 응답이 불완전할 때 멀쩡한 종목이 통째로 상장폐지되는 사고를 막는다.
# 유가증권 2,496 / 코스닥 1,837 건이므로 100 건 미만은 명백한 이상이고,
# 상장폐지는 하루 몇 건이라 5% 면 느슨하면서도 사고는 잡는다.
instrument-sync:
  min-instrument-count: 100
  max-delist-ratio: 0.05

server:
  port: ${SERVER_PORT:8080}
  # 배포 중 처리 중인 주문을 끊지 않는다.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.stockstudy: DEBUG
    org.flywaydb: INFO

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    clean-disabled: false
